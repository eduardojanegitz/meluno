# Banco local de desenvolvimento e testes. Não usar em produção.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meluno
      POSTGRES_PASSWORD: meluno_dev
      POSTGRES_DB: meluno
    ports:
      - "5432:5432"
    volumes:
      - meluno-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meluno -d meluno"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  meluno-pg:
